[tool.poetry]
name = "mortality-simulations"
version = "0.1.0"
description = "Monte Carlo simulations for mortality modeling with parallel processing"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "mortality_simulations"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26.0"
pandas = "^2.1.0"
scipy = "^1.11.0"
threadpoolctl = {version = "^3.2.0", optional = true}
scipy = ">=1.10,<2.0"

[tool.poetry.extras]
diagnostics = ["threadpoolctl"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-benchmark = "^4.0.0"
memory-profiler = "^0.61.0"
matplotlib = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
